<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老板鱼来了</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/disguise.css">
    <script src="src/save.js" defer></script>
    <script src="src/sound.js" defer></script>
    <script src="src/fishing.js" defer></script>
    <script src="src/game.js" defer></script>
    <script src="src/bestiary.js" defer></script>
    <script src="src/shop.js" defer></script>
    <script src="src/disguise.js" defer></script>
    <script src="src/mini.js" defer></script>
    <script src="src/daily-quests.js" defer></script>
    <script src="src/progression.js" defer></script>
    <script src="src/navigation.js" defer></script>
    <script src="src/renderer.js" defer></script>
  </head>
  <body>
    <main>
      <section id="game-view">
        <canvas id="game-canvas" width="420" height="190">
          你的浏览器不支持 Canvas。
        </canvas>
        <div
          id="rare-catch-notice"
          class="rare-catch-notice"
          role="status"
          aria-live="polite"
          hidden
        ></div>
        <p id="game-hint" class="game-hint" hidden>
          鱼漂上钩就点击 · 委托在功能页 · 老板来了切迷你
        </p>
        <section class="ui-area" aria-label="游戏信息">
          <div class="stats-row">
            <span>金币 <strong id="coins">0</strong></span>
            <span>总数 <strong id="total-caught">0</strong></span>
          </div>
          <div class="action-row">
            <button id="open-features" type="button">功能</button>
            <button id="open-mini" type="button">迷你</button>
          </div>
        </section>
        <section id="bestiary-overlay" class="overlay" aria-label="图鉴" hidden>
          <div class="overlay-header">
            <h2>图鉴</h2>
            <button id="close-bestiary" type="button">关闭</button>
          </div>
          <div id="bestiary-list" class="bestiary-list"></div>
        </section>
        <section id="shop-overlay" class="overlay" aria-label="商店" hidden>
          <div class="overlay-header">
            <h2>商店</h2>
            <button id="close-shop" type="button">关闭</button>
          </div>
          <div class="shop-content">
            <p id="shop-message" class="shop-message" aria-live="polite"></p>
            <div id="shop-list" class="shop-list"></div>
          </div>
        </section>
      </section>
      <section id="features-view" class="app-page" aria-label="功能" hidden>
        <div class="page-header">
          <h2>功能</h2>
          <button id="close-features" type="button">返回</button>
        </div>
        <div class="feature-grid">
          <button id="open-daily-quests" type="button">今日委托</button>
          <button id="open-bestiary" type="button">图鉴</button>
          <button id="open-shop" type="button">商店</button>
          <button id="open-report" type="button">报表</button>
          <button id="open-progression" type="button">成长 Lv.1</button>
          <button id="toggle-sound" type="button" aria-pressed="false">
            音效：关
          </button>
          <button id="reset-save" type="button">重置存档</button>
        </div>
      </section>
      <section id="daily-quests-view" class="app-page" aria-label="今日委托" hidden>
        <div class="page-header">
          <h2>今日委托</h2>
          <button id="close-daily-quests" type="button">返回功能页</button>
        </div>
        <div id="daily-quests-list" class="daily-quests-list"></div>
      </section>
      <section id="progression-view" class="app-page" aria-label="成长档案" hidden>
        <div class="page-header">
          <h2>成长档案</h2>
          <button id="close-progression" type="button">返回功能页</button>
        </div>
        <div class="progression-content">
          <section class="progression-level-card">
            <p class="progression-kicker">当前摸鱼等级</p>
            <div class="progression-level-heading">
              <strong id="progression-level">Lv.1</strong>
              <span id="progression-title">实习摸鱼员</span>
            </div>
            <p id="progression-next" class="progression-next"></p>
            <progress id="progression-level-progress" max="5" value="0"></progress>
          </section>
        </div>
      </section>
      <section id="report-view" class="report-view" aria-label="办公报表" hidden>
        <header class="report-header">
          <div>
            <p>项目协同 / 工作日报</p>
            <h1>今日项目推进简报</h1>
          </div>
          <span class="report-date">今日更新</span>
        </header>
        <div class="report-content">
          <section class="report-card report-projects">
            <h2>项目进度</h2>
            <p><strong>需求对齐</strong><span>已完成</span></p>
            <p><strong>方案评审</strong><span>推进中</span></p>
            <p><strong>风险项盘点</strong><span>待跟进</span></p>
          </section>
          <section class="report-card">
            <h2>今日待办</h2>
            <p>[✓] 汇总需求反馈</p>
            <p>[✓] 同步项目进展</p>
            <p>[ ] 补充风险说明</p>
          </section>
          <section class="report-card report-status">
            <h2>在线状态</h2>
            <p><span class="status-dot"></span>专注工作</p>
          </section>
        </div>
        <button id="close-report" class="report-return" type="button">返回</button>
      </section>
    </main>
  </body>
</html>
